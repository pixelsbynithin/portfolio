<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Cards</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; overflow-x: hidden; }

    .spacer { height: 60vh; }

    .section3 {
      width: 100%;
      height: 110vh;
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-evenly;
      overflow: hidden;
      background-color: #ffffff;
    }

    .miniCard {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      flex-shrink: 0;
      will-change: transform;
    }
    .miniCard img {
        width:100%;
        height: 100%;
        object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="spacer"></div>

  <section class="section3" id="section3">
    <div class="miniCard" style="background:#e04c4c;">
        <img src="img/a1.jpg" alt="">
    </div>
    <div class="miniCard" style="background:#e08c4c;">
         <img src="img/a2.jpg" alt="">
    </div>
    <div class="miniCard" style="background:#d4c04c;">
         <img src="img/a3.jpg" alt="">
    </div>
    <div class="miniCard" style="background:#4cae6e;">
         <img src="img/a4.jpg" alt="">
    </div>
    <div class="miniCard" style="background:#4c7ce0;">
         <img src="img/a5.jpg" alt="">
    </div>
    <div class="miniCard" style="background:#9b4ce0;">
         <img src="img/a6.jpg" alt="">
    </div>
  </section>

  <div class="spacer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const section3 = document.getElementById('section3');
    const cards = gsap.utils.toArray('.miniCard');

    gsap.fromTo(cards,
      { y: '-10vh', opacity: 0 },
      {
        y: '80vh',
        opacity: 1,
        ease: 'power2.out',
        stagger: 0.04,
        scrollTrigger: {
          trigger: section3,
          start: 'top top',
          end: 'bottom bottom',
          scrub: 1.4,
          pin: true,
          anticipatePin: 1,
          onUpdate() {
            const vcCy = window.innerHeight / 2;
            cards.forEach(card => {
              const rect = card.getBoundingClientRect();
              const dist = Math.abs((rect.top + rect.height / 2) - vcCy);
              const raw = Math.max(0, 1 - dist / (window.innerHeight * 0.5));
              const eased = raw * raw * (3 - 2 * raw);
              gsap.set(card, { scale: 1 + eased * 0.4, transformOrigin: 'center center' });
            });
          }
        }
      }
    );
  </script>
</body>
</html>
