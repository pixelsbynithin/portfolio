<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
  @font-face {
     font-family: "f2";
     src: url("fonts-new/Ponita\ Serif.ttf") format("truetype");
     font-display: swap;
 }
        body {
            background: #0a0a0c;
            font-family: 'Helvetica Neue', sans-serif;
            overflow-x: hidden;
        }
        .section2 {
            width: 100%;
            height: 1200px;
            background-color: red;
            position: relative;
        }
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        #scroll-trigger {
            position: relative;
            height: 400vh;
            z-index: 1;
            border: 5px solid red;
        }

        #ui {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 5.5rem);
            font-weight: 700;
            color: #fff;
            text-align: center;
            letter-spacing: -0.02em;
            line-height: 1.1;
            opacity: 0;
        }
.titleMain {
        font-size: 4vw;
    font-family: 'f2', sans-serif;
    text-transform: uppercase;
    letter-spacing: 10px;
    font-weight: 600;
    line-height: 1.4;
}

    </style>
</head>

<body>

    <div class="secion1">
        <canvas id="bg-canvas"></canvas>
        <div id="scroll-trigger"></div>

        <div id="ui">
            <h1 id="title" class="titleMain">From Pixels<br>to Production</h1>
        </div>
    </div>
    <div class="section2">

    </div>



    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        /* ── renderer ── */
        const canvas = document.getElementById('bg-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.setClearColor(0x0a0a0c, 1);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
        camera.position.z = 22;

        /* ── geometry ── */
        const COUNT = 12000;
        const posArr = new Float32Array(COUNT * 3);
        const colArr = new Float32Array(COUNT * 3);

        function makeScatter() {
            const p = new Float32Array(COUNT * 3);
            for (let i = 0; i < COUNT; i++) {
                const r = 11 + Math.random() * 16;
                const t = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                p[i * 3] = r * Math.sin(phi) * Math.cos(t);
                p[i * 3 + 1] = r * Math.sin(phi) * Math.sin(t);
                p[i * 3 + 2] = r * Math.cos(phi);
            }
            return p;
        }

        function makeSphere() {
            const p = new Float32Array(COUNT * 3);
            for (let i = 0; i < COUNT; i++) {
                const phi = Math.acos(-1 + (2 * i) / COUNT);
                const theta = Math.sqrt(COUNT * Math.PI) * phi;
                const r = 7.5 + (Math.random() - 0.5) * 0.3;
                p[i * 3] = r * Math.cos(theta) * Math.sin(phi);
                p[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
                p[i * 3 + 2] = r * Math.cos(phi);
            }
            return p;
        }

        const fromPts = makeScatter();
        const toPts = makeSphere();

        /* ── colors ── */
        const fromCols = new Float32Array(COUNT * 3);
        const toCols = new Float32Array(COUNT * 3);
        const col = new THREE.Color();

        for (let i = 0; i < COUNT; i++) {
            col.setHSL(Math.random(), .1, 0.55);
            fromCols[i * 3] = col.r; fromCols[i * 3 + 1] = col.g; fromCols[i * 3 + 2] = col.b;

            col.setHSL(0.54 + (i / COUNT) * 0.18, 0.85, 0.44 + (i / COUNT) * 0.2);
            toCols[i * 3] = col.r; toCols[i * 3 + 1] = col.g; toCols[i * 3 + 2] = col.b;
        }

        for (let i = 0; i < COUNT * 3; i++) { posArr[i] = fromPts[i]; colArr[i] = fromCols[i]; }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));

        const mat = new THREE.PointsMaterial({
            size: 0.07,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true,
            depthWrite: false,
        });

        const points = new THREE.Points(geo, mat);
        scene.add(points);

        /* ── morph state driven by GSAP ── */
        const state = { progress: 0 };

        const title = document.getElementById('title');

        /* headline fade-in on load */
        gsap.to(title, { opacity: 1, duration: 1.2, ease: 'power2.out', delay: 0.5 });

        /* scroll-driven morph via ScrollTrigger scrub */
        gsap.to(state, {
            progress: 1,
            ease: 'none',
            scrollTrigger: {
                trigger: '#scroll-trigger',
                start: 'top top',
                end: 'bottom bottom',
                scrub: 1,
                onUpdate(self) {
                    const p = self.progress;
                }
            }
        });

        /* ── render loop ── */
        let spinAngle = 0;
        let last = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = (now - last) / 1000; last = now;

            const e = state.progress;

            /* morph positions + colors */
            const p = geo.attributes.position.array;
            const c = geo.attributes.color.array;
            for (let i = 0; i < COUNT * 3; i++) {
                p[i] = fromPts[i] + (toPts[i] - fromPts[i]) * e;
                c[i] = fromCols[i] + (toCols[i] - fromCols[i]) * e;
            }
            geo.attributes.position.needsUpdate = true;
            geo.attributes.color.needsUpdate = true;

            /* spin — picks up speed as sphere forms */
            spinAngle += dt * (0.06 + e * 0.3);
            points.rotation.y = spinAngle;
            points.rotation.x = Math.sin(spinAngle * 0.25) * 0.1 * e;

            renderer.render(scene, camera);
        }
        animate();

        /* ── resize ── */
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>

</html>
