<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3x3 Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 20px;
            width: 90vmin;
            height: 90vmin;
            max-width: 600px;
            max-height: 600px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: visible;
            position: relative;
            transition: background 0.3s ease;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .innerChildCard {
            width: 80%;
            height: 80%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
transition: transform .9s cubic-bezier(0, 0, 0.58, 1);

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .innerChildCard.scale-main {
            transform: scale(1.3);
            z-index: 3;
        }

        .innerChildCard.scale-near {
            transform: scale(1.2);
            z-index: 2;
        }

        .innerChildCard.scale-far {
            transform: scale(1.1);
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" data-index="0">
            <div class="innerChildCard">1</div>
        </div>
        <div class="card" data-index="1">
            <div class="innerChildCard">2</div>
        </div>
        <div class="card" data-index="2">
            <div class="innerChildCard">3</div>
        </div>
        <div class="card" data-index="3">
            <div class="innerChildCard">4</div>
        </div>
        <div class="card" data-index="4">
            <div class="innerChildCard">5</div>
        </div>
        <div class="card" data-index="5">
            <div class="innerChildCard">6</div>
        </div>
        <div class="card" data-index="6">
            <div class="innerChildCard">7</div>
        </div>
        <div class="card" data-index="7">
            <div class="innerChildCard">8</div>
        </div>
        <div class="card" data-index="8">
            <div class="innerChildCard">9</div>
        </div>
    </div>

    <script>
        const cards = document.querySelectorAll('.card');
        
        // Function to calculate distance between two cards in the grid
        function getDistance(index1, index2) {
            const row1 = Math.floor(index1 / 3);
            const col1 = index1 % 3;
            const row2 = Math.floor(index2 / 3);
            const col2 = index2 % 3;
            
            // Calculate Manhattan distance (grid distance)
            return Math.abs(row1 - row2) + Math.abs(col1 - col2);
        }

        // Add hover event listeners to each card
        cards.forEach((card, hoveredIndex) => {
            card.addEventListener('mouseenter', () => {
                cards.forEach((otherCard, otherIndex) => {
                    const innerCard = otherCard.querySelector('.innerChildCard');
                    
                    // Remove all scale classes first
                    innerCard.classList.remove('scale-main', 'scale-near', 'scale-far');
                    
                    if (hoveredIndex === otherIndex) {
                        // The hovered card itself
                        innerCard.classList.add('scale-main');
                    } else {
                        const distance = getDistance(hoveredIndex, otherIndex);
                        
                        if (distance === 1) {
                            // Adjacent cards (nearest)
                            innerCard.classList.add('scale-near');
                        } else if (distance === 2) {
                            // Cards at distance 2 (far)
                            innerCard.classList.add('scale-far');
                        }
                        // Distance 3 and 4 (farthest) - no scaling, which could also be 1.05x if you prefer
                        else if (distance >= 3) {
                            innerCard.classList.add('scale-far');
                        }
                    }
                });
            });

            card.addEventListener('mouseleave', () => {
                // Reset all cards when mouse leaves
                cards.forEach(otherCard => {
                    const innerCard = otherCard.querySelector('.innerChildCard');
                    innerCard.classList.remove('scale-main', 'scale-near', 'scale-far');
                });
            });
        });
    </script>
</body>
</html>
