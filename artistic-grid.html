<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistic Flex Layout</title>

    <style>
        /* Scoped reset — does NOT affect Bootstrap */
        .ag-layout * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Main container */
        .ag-container {
            width: 350px;
            height: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Rows */
        .ag-row {
            display: flex;
            gap: 12px;
            flex: 1;
        }

        /* Middle section */
        .ag-middle {
            flex: 2;
            display: flex;
            gap: 12px;
        }

        .ag-middle-left {
            flex: 2;
            display: flex;
        }

        .ag-middle-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Items */
        .ag-item {
            flex: 1;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        /* Colors */
        .ag-item1 .ag-placeholder {
            border-radius: 16px;
            bottom: 0;
            right: 0;
            width: 90px;
            height: 90px;
            background-color: #c17a3d;
        }

        .ag-item2 .ag-placeholder {
            border-radius: 16px;
            bottom: 0;
            left: 0;
            width: 150px;
            height: 150px;
            background-color: #c17a3d;
        }

        .ag-item3 .ag-placeholder {
            border-radius: 16px;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #2a2a2a;
        }

        .ag-item4 .ag-placeholder {
            border-radius: 16px;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            background-color: #d4a845;
            flex: 1 !important;
        }

        .ag-item5 .ag-placeholder {
            border-radius: 16px;
            bottom: 0;
            left: 0;
            width: 140px;
            height: 140px;
            background-color: #c9b89a;
            flex: 2 !important;
        }

        .ag-item6 .ag-placeholder {
            border-radius: 16px;
            top: 0;
            right: 0;
            width: 65px;
            height: 65px;
            background-color: #9d8d7a;
        }

        .ag-item7 .ag-placeholder {
            border-radius: 16px;
            top: 0;
            left: 0;
            width: 100px;
            height: 100px;
            background-color: #1a1a1a;
        }

        .ag-placeholder {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-align: center;
            padding: 10px;
            height: 100%;
        }

        .brr {
            border: 1px solid red !important;
        }
    </style>
</head>

<body>

    <div class="ag-layout">

        <div class="ag-container">

            <!-- Top Row -->
            <div class="ag-row">
                <div class="ag-item ag-item1">
                    <div class="ag-placeholder">Artifact 1</div>
                </div>

                <div class="ag-item ag-item2" style="flex:2;">
                    <div class="ag-placeholder">Historical Site</div>
                </div>
            </div>

            <!-- Middle Section -->
            <div class="ag-middle">

                <div class="ag-middle-left">
                    <div class="ag-item ag-item3">
                        <div class="ag-placeholder">Sculpture</div>
                    </div>
                </div>

                <div class="ag-middle-right">
                    <div class="ag-item ag-item4">
                        <div class="ag-placeholder">Figure</div>
                    </div>

                    <div class="ag-item ag-item5">
                        <div class="ag-placeholder">Temple</div>
                    </div>
                </div>

            </div>

            <!-- Bottom Row -->
            <div class="ag-row">
                <div class="ag-item ag-item6">
                    <div class="ag-placeholder">Artifact 2</div>
                </div>

                <div class="ag-item ag-item7">
                    <div class="ag-placeholder">Artifact 3</div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
