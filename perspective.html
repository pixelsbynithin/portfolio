<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterfly 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
        }

        .bfly {
            perspective: 400px;
            perspective-origin: 50% 100%;
            /* vanishing point at the bottom */
        }

        .bfly img {
            display: block;
            width: 300px;
            transform-origin: bottom center;
            /* pivot at the bottom edge */
            animation: bentForward 0.2s ease-in-out infinite;
        }

        @keyframes bentForward {
            0% {
                transform: rotateX(0deg);
            }

            50% {
                transform: rotateX(45deg);
            }

            /* top bends toward user */
            100% {
                transform: rotateX(0deg);
            }
        }

        .bfly-whole {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transform: rotate(30deg);
        }
        .bfly-body {
            display: flex;
            justify-content: center;
        }
        .bfly-body img {
            height: 50px;
        }
    </style>
</head>

<body>
    <div class="bfly-whole">
        <div class="bfly">
            <img src="bf1.png" alt="butterfly">
        </div>
        <div class="bfly-body ">
            <img src="bf1body.png" alt="">
        </div>
    </div>
</body>

</html>
