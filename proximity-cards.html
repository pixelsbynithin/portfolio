<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proximity Hover Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 90vw;
            height: 90vh;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .card {
            position: absolute;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.7));
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease,
                        z-index 0s 0.3s;
            transform-origin: center center;
            z-index: 1;
        }

        .card:hover {
            z-index: 100 !important;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease,
                        z-index 0s;
        }

        .card.scaling {
            z-index: 50;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease,
                        z-index 0s;
        }

        .card h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 14px;
            color: #666;
        }

        /* Different card sizes */
        .card-1 {
            width: 220px;
            height: 280px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white;
        }

        .card-2 {
            width: 180px;
            height: 200px;
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            color: white;
        }

        .card-3 {
            width: 260px;
            height: 180px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .card-4 {
            width: 200px;
            height: 240px;
            background: linear-gradient(135deg, #feca57, #ff9ff3);
            color: white;
        }

        .card-5 {
            width: 240px;
            height: 220px;
            background: linear-gradient(135deg, #48c6ef, #6f86d6);
            color: white;
        }

        .card h2, .card p {
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="card card-1" data-id="1">
            <h2>Card 1</h2>
            <p>220 × 280</p>
        </div>
        <div class="card card-2" data-id="2">
            <h2>Card 2</h2>
            <p>180 × 200</p>
        </div>
        <div class="card card-3" data-id="3">
            <h2>Card 3</h2>
            <p>260 × 180</p>
        </div>
        <div class="card card-4" data-id="4">
            <h2>Card 4</h2>
            <p>200 × 240</p>
        </div>
        <div class="card card-5" data-id="5">
            <h2>Card 5</h2>
            <p>240 × 220</p>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const cards = document.querySelectorAll('.card');

        // Function to randomly position cards
        function positionCardsRandomly() {
            const containerRect = container.getBoundingClientRect();
            
            cards.forEach(card => {
                const cardWidth = card.offsetWidth;
                const cardHeight = card.offsetHeight;
                
                // Random position within container bounds
                const maxX = containerRect.width - cardWidth - 20;
                const maxY = containerRect.height - cardHeight - 20;
                
                const randomX = Math.random() * maxX + 10;
                const randomY = Math.random() * maxY + 10;
                
                card.style.left = randomX + 'px';
                card.style.top = randomY + 'px';
            });
        }

        // Function to calculate distance between two card centers
        function getDistance(card1, card2) {
            const rect1 = card1.getBoundingClientRect();
            const rect2 = card2.getBoundingClientRect();
            
            const center1X = rect1.left + rect1.width / 2;
            const center1Y = rect1.top + rect1.height / 2;
            const center2X = rect2.left + rect2.width / 2;
            const center2Y = rect2.top + rect2.height / 2;
            
            return Math.sqrt(
                Math.pow(center2X - center1X, 2) + 
                Math.pow(center2Y - center1Y, 2)
            );
        }

        // Proximity-based scaling on hover
        cards.forEach(hoveredCard => {
            hoveredCard.addEventListener('mouseenter', () => {
                // Scale the hovered card to 1.3x
                hoveredCard.style.transform = 'scale(1.3)';
                hoveredCard.style.boxShadow = '0 16px 48px rgba(0, 0, 0, 0.4)';
                
                // Calculate distances for other cards
                const distances = [];
                cards.forEach(card => {
                    if (card !== hoveredCard) {
                        const distance = getDistance(hoveredCard, card);
                        distances.push({ card, distance });
                    }
                });
                
                // Sort by distance
                distances.sort((a, b) => a.distance - b.distance);
                
                // Apply scaling based on proximity
                distances.forEach(({ card, distance }, index) => {
                    card.classList.add('scaling');
                    
                    // Nearest cards (closest 2) scale to 1.2x
                    if (index < 2) {
                        card.style.transform = 'scale(1.2)';
                        card.style.boxShadow = '0 12px 36px rgba(0, 0, 0, 0.3)';
                    } else {
                        // Farthest cards stay at 1x
                        card.style.transform = 'scale(1)';
                        card.style.boxShadow = '0 8px 24px rgba(0, 0, 0, 0.2)';
                    }
                });
            });
            
            hoveredCard.addEventListener('mouseleave', () => {
                // Reset all cards to original scale
                cards.forEach(card => {
                    card.style.transform = 'scale(1)';
                    card.style.boxShadow = '0 8px 24px rgba(0, 0, 0, 0.2)';
                    card.classList.remove('scaling');
                });
            });
        });

        // Position cards randomly on load
        positionCardsRandomly();

        // Reposition on window resize
        window.addEventListener('resize', positionCardsRandomly);
    </script>
</body>
</html>
