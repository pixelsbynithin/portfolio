<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll 3D Cards</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden; /* no page scroll */
    background: #0a0a0a;
  }

  /*
   * SCENE — the perspective container, fills the viewport.
   */
  #scene {
    position: fixed;
    inset: 0;
    perspective: 800px;
    perspective-origin: 50% 50%;
    overflow: hidden;
  }

  /*
   * WORLD — the 3D stage.
   * Anchored at the screen center so x:0, y:0 = center of screen.
   */
  #world {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-style: preserve-3d;
  }

  /*
   * CARD BASE STYLE
   * Each card is offset from the world center via translate(x, y) in JS.
   * margin-left/top shift the card so its own center aligns with x/y.
   */
  .card {
    position: absolute;
    will-change: transform, opacity;
    border-radius: 10px;
    width: 240px;
    height: 150px;
    margin-left: -120px; /* half of width  */
    margin-top:   -75px; /* half of height */
  }
  .card{
  transform-style: preserve-3d;
  backface-visibility: hidden;
}
  .card:hover {
    outline: 3px solid red;
  }
</style>
</head>
<body>

<div id="scene">
  <div id="world">

    <!--
    ═══════════════════════════════════════════════════════════════
      YOUR CARDS — edit freely.

      data-x   px offset from screen center. Negative = left.
      data-y   px offset from screen center. Negative = up.
      data-z   starting depth in px. More negative = further back
               (card appears later as you scroll forward).
               0 = right at the viewer's eye.

      Put any HTML content you want inside each card.
      Scroll down to move cards toward you.
    ═══════════════════════════════════════════════════════════════
    -->

    <div class="card" data-x="0"    data-y="0"    data-z="-4000" style="background:#e63946;">
      <p style="color:#fff;padding:16px;font-family:sans-serif;font-size:14px;">Card 1</p>
    </div>

    <div class="card" data-x="-300" data-y="-180" data-z="-3500" style="background:#2a9d8f;">
      <p style="color:#fff;padding:16px;font-family:sans-serif;font-size:14px;">Card 2</p>
    </div>

    <div class="card" data-x="300"  data-y="-180" data-z="-3000" style="background:#e9c46a;">
      <p style="color:#333;padding:16px;font-family:sans-serif;font-size:14px;">Card 3</p>
    </div>

    <div class="card" data-x="-300" data-y="180"  data-z="-2500" style="background:#f4a261;">
      <p style="color:#fff;padding:16px;font-family:sans-serif;font-size:14px;">Card 4</p>
    </div>

    <div class="card" data-x="300"  data-y="180"  data-z="-2000" style="background:#457b9d;">
      <p style="color:#fff;padding:16px;font-family:sans-serif;font-size:14px;">Card 5</p>
    </div>

    <div class="card" data-x="0"    data-y="-220" data-z="-1500" style="background:#8ecae6;">
      <p style="color:#333;padding:16px;font-family:sans-serif;font-size:14px;">Card 6</p>
    </div>

    <div class="card" data-x="0"    data-y="220"  data-z="-1000" style="background:#6d6875;">
      <p style="color:#fff;padding:16px;font-family:sans-serif;font-size:14px;">Card 7</p>
    </div>

    <div class="card" data-x="-420" data-y="0"    data-z="-500"  style="background:#b5838d;">
      <p style="color:#fff;padding:16px;font-family:sans-serif;font-size:14px;">Card 8</p>
    </div>

    <div class="card" data-x="420"  data-y="0"    data-z="0"     style="background:#52b788;">
      <p style="color:#fff;padding:16px;font-family:sans-serif;font-size:14px;">Card 9</p>
    </div>

    <div class="card" data-x="-100"    data-y="-90"    data-z="500"   style="background:#c9cba3;">
      <p style="color:#333;padding:16px;font-family:sans-serif;font-size:14px;">Card 10</p>
    </div>

  </div>
</div>


<script>
// ─────────────────────────────────────────────────────────────────
//  CONFIG
// ─────────────────────────────────────────────────────────────────
const SCROLL_SPEED = 1.4;  // Z units moved per wheel-delta pixel
const Z_NEAR       = 800;  // cards at or past this Z disappear (passed the viewer)
const FADE_RANGE   = 300;  // Z units over which cards fade in / fade out

// ─────────────────────────────────────────────────────────────────
//  READ CARDS FROM DOM
// ─────────────────────────────────────────────────────────────────
const cards = Array.from(document.querySelectorAll('.card')).map(el => ({
  el,
  baseX: parseFloat(el.dataset.x) || 0,
  baseY: parseFloat(el.dataset.y) || 0,
  baseZ: parseFloat(el.dataset.z) || 0,
}));

const minBaseZ = Math.min(...cards.map(c => c.baseZ)); // furthest back authored Z

// ─────────────────────────────────────────────────────────────────
//  SCROLL STATE — virtual camera offset along Z
// ─────────────────────────────────────────────────────────────────
let cameraZ = 0;

// Mouse wheel
window.addEventListener('wheel', e => {
  e.preventDefault();
  cameraZ += e.deltaY * SCROLL_SPEED;
}, { passive: false });

// Touch
let lastTouchY = null;
window.addEventListener('touchstart',  e => { lastTouchY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchmove',   e => {
  if (lastTouchY === null) return;
  cameraZ += (lastTouchY - e.touches[0].clientY) * SCROLL_SPEED * 2;
  lastTouchY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchend',    () => { lastTouchY = null; });

// Keyboard
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); cameraZ += 150; }
  if (e.key === 'ArrowUp')                    { e.preventDefault(); cameraZ -= 150; }
});

// ─────────────────────────────────────────────────────────────────
//  RENDER LOOP — no tweens, purely scroll-driven each frame
// ─────────────────────────────────────────────────────────────────
function render() {
  requestAnimationFrame(render);

  cards.forEach(({ el, baseX, baseY, baseZ }) => {
    const worldZ = baseZ + cameraZ; // current depth of this card

    // Hide cards that have fully passed the viewer
    if (worldZ >= Z_NEAR) {
      el.style.visibility = 'hidden';
      return;
    }
    el.style.visibility = 'visible';

    // Opacity: fade in from the far background, fade out near the viewer
    let opacity = 1;
    if (worldZ < minBaseZ + FADE_RANGE) {
      opacity = Math.max(0, (worldZ - minBaseZ) / FADE_RANGE);
    }
    if (worldZ > Z_NEAR - FADE_RANGE) {
      opacity = Math.min(opacity, Math.max(0, (Z_NEAR - worldZ) / FADE_RANGE));
    }
    el.style.opacity = opacity.toFixed(3);

    // Position: X/Y stay fixed; Z changes with scroll
    el.style.transform = `translate(${baseX}px, ${baseY}px) translateZ(${worldZ}px)`;
  });
}

render();
</script>
</body>
</html>
