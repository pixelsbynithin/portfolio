    <style>
        * {

        .section1 {
            width: 100%;
            height: 100vh;
            display: flex;
            background-color: red;
        }

        .section2 {
            width: 100%;
            height: max-content;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: green;
        }

        .section3 {
            width: 100%;
            height: 100vh;
            display: flex;
            background-color: yellow;
        }

        .innerCard {
            width: 100%;
            height: 550px;
            background-color: white;
        }
    </style>

    <section class="section1"></section>
    <section class="section2">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        
        const cards = gsap.utils.toArray([".innerCard", ".innerCard2", ".innerCard3", ".innerCard4"]);

cards.forEach((card, i) => {
    gsap.fromTo(card,
        {
            width: "100px",
            height: "100px",
            y: `${-1300 - (i * 200)}px`,
        },
        {
            width: "100%",
            height: "550px",
            y: 0,
            ease: "power3.out",
            scrollTrigger: {
                trigger: ".section1",
                start: "top top",   // each card starts a bit later
                end: "bottom top",
                scrub: 1,
            }
        }
    );
});
